<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally Sheet</title>
<style>
    @page { size: A4 portrait; margin: 6mm; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body { font-family: Arial, sans-serif; color: #000; background-color: #fff; }

    /* ===== แผงตั้งค่า (ไม่พิมพ์) ===== */
    .panel {
        position: sticky; top: 0; z-index: 10;
        background: #1f3a5f; color: #fff;
        padding: 10px 16px;
        display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end;
        box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    .panel label { display: flex; flex-direction: column; font-size: 12px; gap: 3px; }
    .panel input {
        width: 90px; padding: 6px 8px; font-size: 15px;
        border: 1px solid #9bb; border-radius: 6px;
    }
    .panel button {
        padding: 8px 14px; font-size: 14px; border: 0; border-radius: 6px;
        cursor: pointer; background: #ffd700; color: #000; font-weight: bold;
    }
    .panel button.ghost { background: #fff; }
    .panel .info { font-size: 12px; opacity: .9; flex-basis: 100%; }
    .panel .spacer { flex: 1; }
    .sheets { padding: 12px 16px; }
    .page { width: 100%; box-sizing: border-box; }
    @media screen {
        .page { border: 1px solid #ccc; padding: 10px; margin-bottom: 16px; }
    }
    @media print {
        .panel { display: none !important; }
        .sheets { padding: 0; }
    }

    /* ===== แผ่นงาน (เหมือนเดิม) ===== */
    .page-break { page-break-after: always; }
    .header { text-align: center; margin-bottom: 6px; }
    .header h1 { font-size: 17px; margin: 0; padding: 0; }
    .header p { font-size: 10px; margin: 2px 0 0 0; color: #333; }

    table.tally-table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 10px; }
    table.tally-table td {
        border: 1px solid #000; text-align: center; vertical-align: middle;
        font-size: 11px; font-weight: bold; height: 22px;
    }
    table.tally-table td.bus {
        background-color: #ffd700 !important; font-size: 12px; font-weight: 900;
        border: 2px solid #000;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }

    .bus-log-section { margin-top: 5px; border-top: 2px dashed #000; padding-top: 6px; }
    .bus-log-title { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
    table.bus-log-table { width: 100%; border-collapse: collapse; }
    table.bus-log-table th, table.bus-log-table td {
        border: 1px solid #000; padding: 4px; text-align: center; font-size: 11px;
    }
    table.bus-log-table td { height: 26px; }
    table.bus-log-table td.in { padding: 0; }
    table.bus-log-table td.in input {
        width: 100%; box-sizing: border-box; border: 0; margin: 0;
        padding: 4px 3px; font: inherit; font-size: 11px; text-align: center;
        background: transparent; color: #000;
    }
    @media screen {
        table.bus-log-table td.in input { background: #fffbe0; }
        table.bus-log-table td.in input:focus { outline: 2px solid #1f3a5f; background: #fff; }
    }
    table.bus-log-table th {
        background-color: #f0f0f0 !important; font-weight: bold;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
</style>
</head>
<body>

<div class="panel">
    <label><span data-i18n="total"></span><input type="number" id="total" min="1" value="500"></label>
    <label><span data-i18n="perBus"></span><input type="number" id="perBus" min="1" value="40"></label>
    <label><span data-i18n="perPage"></span><input type="number" id="perPage" min="1" value="250"></label>
    <label><span data-i18n="cols"></span><input type="number" id="cols" min="1" max="30" value="10"></label>
    <button id="apply" data-i18n="apply"></button>
    <button id="print" data-i18n="print"></button>
    <div class="spacer"></div>
    <button id="lang" class="ghost"></button>
    <div class="info" id="info"></div>
</div>

<div class="sheets" id="sheets"></div>

<script>
const T = {
    en: {
        total: "Total people", perBus: "People per bus", perPage: "Numbers per page",
        cols: "Columns per row", apply: "Update", print: "🖨 Print", lang: "ภาษาไทย",
        info: (p, b) => `Result: ${p} page(s), ${b} bus(es). Change the numbers, then press Update.`
    },
    th: {
        total: "จำนวนคนทั้งหมด", perBus: "คนต่อรถ 1 คัน", perPage: "จำนวนช่องต่อหน้า",
        cols: "จำนวนช่องต่อแถว", apply: "อัปเดต", print: "🖨 พิมพ์", lang: "English",
        info: (p, b) => `ผลลัพธ์: ${p} หน้า, รถ ${b} คัน  แก้ตัวเลขแล้วกด "อัปเดต"`
    }
};
let lang = "en", lastPages = 0, lastBuses = 0;

// ข้อมูลคนขับที่กรอกไว้ (จำไว้ในเครื่อง ปิดแล้วเปิดใหม่ยังอยู่)
const STORE = "tallySheetDrivers";
let drivers = {};
try { drivers = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { drivers = {}; }
function saveDrivers() { try { localStorage.setItem(STORE, JSON.stringify(drivers)); } catch (e) {} }
function esc(v) { return String(v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

function num(id, def) {
    const v = parseInt(document.getElementById(id).value, 10);
    return v > 0 ? v : def;
}

function render() {
    const total = num("total", 500), perBus = num("perBus", 40);
    const perPage = num("perPage", 250), cols = num("cols", 10);
    const pages = Math.ceil(total / perPage);
    const buses = Math.ceil(total / perBus);
    let html = "";

    for (let p = 0; p < pages; p++) {
        const start = p * perPage + 1;
        const end = Math.min(total, (p + 1) * perPage);

        let rows = "";
        for (let r = start; r <= end; r += cols) {
            rows += "<tr>";
            for (let c = 0; c < cols; c++) {
                const n = r + c;
                if (n > end) { rows += "<td></td>"; continue; }
                rows += (n % perBus === 0)
                    ? `<td class="bus">${n} 🚌</td>`
                    : `<td>${n}</td>`;
            }
            rows += "</tr>";
        }

        const logSection = "";

        html += `
<div class="page page-break">
    <div class="header">
        <h1>ตารางนับยอดผู้เข้าร่วมงาน / Tally Sheet (${start} - ${end})</h1>
        <p>ขีดทับตัวเลขเมื่อมอบ Tag ติดกระเป๋า 1 คน | ช่องสีเหลืองคือจุดตัดยอดรถบัสทุกๆ ${perBus} คน</p>
    </div>
    <table class="tally-table"><tbody>${rows}</tbody></table>
    ${logSection}
</div>`;
    }

    // แผ่นสรุปรถบัส แยกเป็นอีกแผ่น
    let logRows = "";
    for (let b = 1; b <= buses; b++) {
        const bStart = (b - 1) * perBus + 1;
        const bEnd = Math.min(total, b * perBus);
        const d = drivers[b] || {};
        const cell = k => `<td class="in"><input data-b="${b}" data-k="${k}" value="${esc(d[k] || "")}"></td>`;
        logRows += `<tr><td>${b}</td><td>${bStart} - ${bEnd}</td>${cell("name")}${cell("plate")}${cell("phone")}<td></td><td></td></tr>`;
    }
    html += `
<div class="page">
    <div class="header">
        <h1>ตารางบันทึกการปล่อยรถบัส / Bus Log (รอบที่ 1 - ${buses})</h1>
        <p>ผู้เข้าร่วมทั้งหมด ${total} คน | รถคันละ ${perBus} คน</p>
    </div>
    <table class="bus-log-table">
        <thead><tr>
            <th style="width: 7%;">คันที่</th>
            <th style="width: 13%;">ช่วงลำดับคน</th>
            <th style="width: 20%;">ชื่อคนขับ</th>
            <th style="width: 16%;">ทะเบียนรถ / เบอร์รถ</th>
            <th style="width: 16%;">เบอร์โทรคนขับ</th>
            <th style="width: 14%;">จำนวนผู้โดยสาร</th>
            <th style="width: 14%;">เวลาออกจริง</th>
        </tr></thead>
        <tbody>${logRows}</tbody>
    </table>
</div>`;

    document.getElementById("sheets").innerHTML = html;
    document.title = `Tally Sheet (1-${total})`;
    lastPages = pages + 1; lastBuses = buses;
    applyLang();
}

function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = T[lang][el.dataset.i18n];
    });
    document.getElementById("lang").textContent = T[lang].lang;
    document.getElementById("info").textContent = T[lang].info(lastPages, lastBuses);
}

document.getElementById("sheets").addEventListener("input", e => {
    const t = e.target;
    if (!t.dataset || !t.dataset.k) return;
    (drivers[t.dataset.b] = drivers[t.dataset.b] || {})[t.dataset.k] = t.value;
    saveDrivers();
});
document.getElementById("apply").onclick = render;
document.getElementById("print").onclick = () => window.print();
document.getElementById("lang").onclick = () => { lang = lang === "en" ? "th" : "en"; applyLang(); };
document.querySelectorAll(".panel input").forEach(i =>
    i.addEventListener("keydown", e => { if (e.key === "Enter") render(); }));

render();
</script>
</body>
</html>
